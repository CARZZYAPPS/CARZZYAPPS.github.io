<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The leaderboards for all of our games.">
    <meta name="keywords" content="carzzy apps, games, apps, crazzy apps, leaderboard">
    <meta name="author" content="Avis, DeBus">
    <title>Leaderboards</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }

    h2 {
      color: #00d1b2;
      text-shadow: 0 0 15px rgba(0, 209, 178, 0.5);
      font-size: 2.5rem;
      margin-top: 100px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 40px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .project-card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-decoration: none;
      color: white;
      display: block;
      transition: 0.3s;
    }

    .project-card:hover {
      border-color: #00d1b2;
      transform: translateY(-5px);
      box-shadow: 0 5px 20px rgba(0, 209, 178, 0.2);
    }

    .project-title {
      color: #00d1b2;
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 5px;
      display: block;
    }

    .project-desc {
      font-size: 0.9rem;
      color: #aaa;
    }

    /* CONTACT SECTION */
    .contact-section {
      margin-top: 60px;
      text-align: center;
      border-top: 1px solid #222;
      padding-top: 40px;
      width: 100%;
      max-width: 400px;
    }

    .contact-btn {
      display: inline-block;
      background: transparent;
      color: #00d1b2;
      border: 2px solid #00d1b2;
      padding: 15px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      margin-top: 10px;
    }

    .contact-btn:hover {
      background: #00d1b2;
      color: #0a0a0a;
      box-shadow: 0 0 20px rgba(0, 209, 178, 0.4);
    }

    footer {
      margin: 50px;
      font-size: 0.8rem;
      color: #444;
    }
      
  </style>
</head>
<body>

  <script src="/nav-bar.js"></script>
  
  <h2>Leaderboards</h2>
  <p class="subtitle">Leaderboards For Our Games & Apps</p>

  <div class="container">

    <a href="/Leaderboards/RR" class="project-card">
      <span class="project-title">Rhythm Runner</span>
      <span class="project-desc">Rhythm Runner Leaderboard</span><br>
    </a>

    <a href="/Under-Construction" class="project-card">
      <span class="project-title">DeCrossyBus</span>
      <span class="project-desc">DeCrossyBus Leaderboard</span><br>
    </a>

  </div>

  <footer>
    Avis & DeBus | v1.0.0 PRO
  </footer>
  
</body>
</html>
