<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Runner</title>
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="/nav-bar.css">

    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h2 {
            font-size: 32px;
        }

        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #00d1b2;
        }

        .menu-btn {
            padding: 12px 30px;
            background: #00d1b2;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        #usernamePrompt {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #00d1b2;
            width: 260px;
        }

        #usernameInput {
            width: 90%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00d1b2;
            background: #0a0a0a;
            color: white;
            text-align: center;
        }

        #usernameDisplay {
            position: absolute;
            top: 100px;
            left: 20px;
            color: #00d1b2;
            font-size: 16px;
        }

        #changeUsernameBtn {
            display: none;
            
        }

        canvas {
            background: #050505;
            width: 100%;
            max-width: 800px;
            border-bottom: 4px solid #00d1b2;
        }

        .stats {
            position: absolute;
            top: 100px;
            right: 20px;
            color: #00d1b2;
            font-size: 18px;
            font-weight: bold;
        }

        #best-label {
            color: #ffd700;
            font-size: 14px;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            display: none;
            gap: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .action-btn {
            width: 95px;
            height: 95px;
            background: rgba(0, 209, 178, 0.2);
            border: 3px solid #00d1b2;
            border-radius: 50%;
            color: white;
            font-weight: bold;
        }
        
    </style>
</head>

<body>

    <nav>
        <a class="logo" href="/"><img src="https://carzzyapps.github.io/Carzzy Apps Logo.png"
                style="width:150px;height:50px;"></a>
        <h1 class="nav-head">Carzzy Apps</h1>
        <span class="nav-links">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="https://carzzyapps.github.io/Leaderboards">Leaderboards</a>
            <a class="nav-link" href="https://carzzyapps.github.io/scymores-games">Scymore's Games</a>
        </span>
    </nav>

    <div class="stats">
        SCORE: <span id="score">0</span><br>
        <div id="best-label">BEST: <span id="best-score">0</span></div>
    </div>

    <div id="usernameDisplay"></div>

    <div id="ui-layer">
        <img src="https://carzzyapps.github.io/Rhythm-Runner/rhythm-dj.png" style="width: 60px;">
        <h2 id="title">RHYTHM RUNNER</h2>
        <p><b>JUMP</b> spikes | <b>DUCK</b> drones</p>

        <button id="startBtn" class="menu-btn">START GAME</button><br>
        <button id="changeUsernameBtn" class="menu-btn">CHANGE USERNAME</button>
    </div>

    <!-- USERNAME PROMPT -->
    <div id="usernamePrompt">
        <h3>ENTER USERNAME</h3>
        If you already have one, make sure not to misspell it. (<a href="https://carzzyapps.github.io/Leaderboards/RR" style="color: #00d1b2" target="_blank">Check out the Leaderboard</a> to confirm your username)<br><br>
        <input id="usernameInput" type="text" maxlength="20" placeholder="Do not use your real name">
        <button id="saveUsernameBtn" class="menu-btn">SAVE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls" id="controls">
        <button class="action-btn" id="jumpBtn">JUMP</button>
        <button class="action-btn" id="duckBtn">DUCK</button>
    </div>

    <script>
        alert('Due to the new leaderboard update, some usernames may have been slightly changed. Check the leaderboard to confirm what your username is before entering it.');
        // USERNAME SYSTEM
        let username = localStorage.getItem("rr_username") || null;

        // Hide or show change button on load
        if (!username) {
            document.getElementById("changeUsernameBtn").style.display = "none";
        } else {
            document.getElementById("changeUsernameBtn").style.display = "inline";
        }

        function updateUsernameDisplay() {
            if (username) {
                document.getElementById("usernameDisplay").innerText = "USER: " + username;
                document.getElementById("changeUsernameBtn").style.display = "inline";
            }
        }

        function askForUsername() {
            document.getElementById("usernamePrompt").style.display = "block";
            document.getElementById("usernameInput").value = username || "";
        }

        document.getElementById("saveUsernameBtn").onclick = () => {
            const input = document.getElementById("usernameInput").value.trim();

            if (input.length < 2) {
                alert("Username must be at least 2 characters");
                return;
            }

            username = input.toUpperCase();
            localStorage.setItem("rr_username", username);

            document.getElementById("usernamePrompt").style.display = "none";
            updateUsernameDisplay();
            submitScore(username, score);
        };

        document.getElementById("changeUsernameBtn").onclick = () => {
            askForUsername();
        };


        updateUsernameDisplay();

        // SUBMIT SCORE (username + score)
        async function submitScore(name, score) {
            const url = "https://script.google.com/macros/s/AKfycbw9C3MZ9QH2-fBylVy52fMTwNib_NQVVwUp7Eekk_cq-HsMV_WBL2TWU50cGc5CxGT0/exec";

            const payload = {
                username: name,
                score: score,
            };

            try {
                await fetch(url, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.log("Score submit failed:", err);
            }
        }

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const controls = document.getElementById('controls');

            // --- 1. PLAYLIST SETUP ---
            const playlist = [
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Bekitcha.mp3',
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Hershy%20Weinberger%20and%20Shmueli%20Ungar%20-%20RTVT.mp3',
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Arcade.mp3',
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Ari%20Samet%20and%20Ancii%20-%20Hood.mp3',
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Fire-shmulei_ungar.mp3',
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Parentches.mp3',
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Zusha-Pull_Me_Through.mp3',
                'https://github.com/CARZZYAPPS/music/raw/refs/heads/main/Zusha%20-%20Everything%20Can%20Change.mp3'

            ];

            function shufflePlaylist(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            let currentTrackIndex = 0;
            const bgMusic = new Audio(playlist[currentTrackIndex]);
            bgMusic.volume = 1.0;

            bgMusic.addEventListener('ended', () => {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
                bgMusic.src = playlist[currentTrackIndex];
                bgMusic.play();
            });

            // --- 2. CHEAT SETUP ---
            let ghostMode = false;
            let inputBuffer = "";
            const cheatCode = "JSFGSGFKJSHUEGDBDCVGDSLFCBJHGFSDJTFSLJGFSYCSGKAJHBTCOSIEUGRCKDGFBLJKDGFKHDGFJHSDGKSFHDGJDHGFJHVJDGFJSDHGFKJSDHFJHDSGKJSDHFJHDGSKHGFGSDMNFGJDHGFDJHFGDJHF";

            let gameActive = false, score = 0, bestScore = localStorage.getItem('rr_best_pro') || 0;
            document.getElementById('best-score').innerText = bestScore;

            let player = { x: 60, y: 0, w: 35, h: 45, baseH: 45, dy: 0, jumpPower: -15, grounded: true, isDucking: false };
            let obstacles = [], gravity = 0.8, groundY = 0;
            let gameSpeed = 6.5, spawnTimer = 0;
            let isJumpKeyPressed = false;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = 350;
                groundY = canvas.height - 50;
                player.y = groundY - player.h;
            }
            window.onresize = resize;
            resize();

            function jump() {
                if (player.grounded && gameActive && !player.isDucking && !isJumpKeyPressed) {
                    player.dy = player.jumpPower;
                    player.grounded = false;
                    isJumpKeyPressed = true;
                }
            }

            function toggleDuck(ducking) {
                if (!player.grounded && ducking) return;
                player.isDucking = ducking;
                player.h = ducking ? 22 : player.baseH;
                player.y = groundY - player.h;
            }

            window.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowUp' || e.code === 'Space') jump();
                if (e.code === 'ArrowDown') toggleDuck(true);

                inputBuffer += e.key.toUpperCase();
                if (inputBuffer.includes(cheatCode)) {
                    ghostMode = !ghostMode;
                    inputBuffer = "";
                    document.getElementById('cheat-indicator').style.display = ghostMode ? 'block' : 'none';
                }
                if (inputBuffer.length > 5) inputBuffer = inputBuffer.substring(1);
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowUp' || e.code === 'Space') isJumpKeyPressed = false;
                if (e.code === 'ArrowDown') toggleDuck(false);
            });

            document.getElementById('jumpBtn').ontouchstart = (e) => { e.preventDefault(); jump(); };
            document.getElementById('jumpBtn').ontouchend = (e) => { e.preventDefault(); isJumpKeyPressed = false; };
            document.getElementById('duckBtn').ontouchstart = (e) => { e.preventDefault(); toggleDuck(true); };
            document.getElementById('duckBtn').ontouchend = (e) => { e.preventDefault(); toggleDuck(false); };

            function update() {
                if (!gameActive) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = "rgba(0, 209, 178, 0.5)";
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

                spawnTimer++;
                let nextSpawn = Math.floor(Math.random() * (85 - 35) + 35);
                if (spawnTimer > Math.max(nextSpawn, 75 - gameSpeed)) {
                    const isDrone = Math.random() > 0.8;
                    obstacles.push({
                        x: canvas.width, w: 30,
                        h: isDrone ? 1000 : 45,
                        y: isDrone ? groundY - 1030 : groundY - 45,
                        visualY: isDrone ? groundY - 55 : groundY - 45,
                        type: isDrone ? 'drone' : 'spike',
                        passed: false
                    });
                    spawnTimer = 0;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let o = obstacles[i];
                    o.x -= gameSpeed;

                    ctx.fillStyle = o.type === 'drone' ? "#ff0077" : "#00d1b2";
                    if (o.type === 'drone') {
                        ctx.fillRect(o.x, o.visualY, o.w, 15);
                        ctx.fillStyle = "rgba(255, 0, 119, 0.3)";
                        ctx.fillRect(o.x - 10, o.visualY + 5, o.w + 20, 5);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(o.x, groundY);
                        ctx.lineTo(o.x + o.w / 2, groundY - o.h);
                        ctx.lineTo(o.x + o.w, groundY);
                        ctx.fill();
                    }

                    if (!ghostMode) {
                        if (o.x < player.x + player.w && o.x + o.w > player.x &&
                            player.y < o.y + o.h && player.y + player.h > o.y) {
                            gameOver();
                        }
                    }

                    if (o.x + o.w < player.x && !o.passed) {
                        o.passed = true;
                        score += 10;
                        document.getElementById('score').innerText = score;
                        gameSpeed += 0.12;
                    }
                    if (o.x < -50) obstacles.splice(i, 1);
                }

                if (!player.grounded) {
                    player.dy += gravity;
                    player.y += player.dy;
                }
                if (player.y > groundY - player.h) {
                    player.y = groundY - player.h;
                    player.dy = 0;
                    player.grounded = true;
                }

                ctx.globalAlpha = ghostMode ? 0.4 : 1.0;
                ctx.shadowBlur = 10; ctx.shadowColor = "#00d1b2";
                ctx.fillStyle = player.isDucking ? "#008a76" : "#111";
                ctx.strokeStyle = "#00d1b2";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(player.x, player.y, player.w, player.h, 5);
                ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;

                requestAnimationFrame(update);
            }

        function gameOver() {
            gameActive = false;
            bgMusic.pause();
            bgMusic.currentTime = 0;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('rr_best_pro', bestScore);
                document.getElementById('best-score').innerText = bestScore;
            if (username) {
                submitScore(username, score);
            }            
            }

            document.getElementById('ui-layer').style.display = 'block';
            document.getElementById('title').innerText = "SYSTEM CRASH";
            controls.style.display = 'none';
        }

        document.getElementById('startBtn').onclick = () => {
            if (!username) {
                askForUsername();
                return;
            }
            shufflePlaylist(playlist);
            currentTrackIndex = 0;
            bgMusic.src = playlist[currentTrackIndex];
            score = 0;
            obstacles = [];
            gameSpeed = 6.5;
            spawnTimer = 0;

            document.getElementById('score').innerText = "0";
            document.getElementById('ui-layer').style.display = 'none';
            controls.style.display = 'flex';

            gameActive = true;
            bgMusic.play().catch(e => { });
            update();
        };
    </script>

</body>

</html>
