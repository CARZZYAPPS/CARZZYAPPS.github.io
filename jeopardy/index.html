<!DOCTYPE html>
<html>
<head>
  <title>Jeopardy Game</title>
  <style>
    body { font-family: Arial; background: #001f3f; color: white; text-align: center; }
    #board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 90%; margin: auto; }
    .cell { background: #003f7f; padding: 20px; cursor: pointer; font-size: 22px; }
    .category { background: #005fbf; font-weight: bold; }
    #popup, #adminPanel {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center;
    }
    #popupBox, #adminBox {
      background: white; color: black; padding: 20px; width: 450px; max-height: 90%; overflow-y: auto;
    }
    button { padding: 10px; margin: 5px; }
    input, select, textarea { width: 100%; margin: 5px 0; padding: 8px; }
  </style>
</head>
<body>

<h1>Jeopardy</h1>
<h2 id="score">Score: 0</h2>

<!-- Hidden admin trigger -->
<input id="adminTrigger" placeholder="Type here…" style="margin-bottom:10px;">

<div id="board"></div>

<!-- Question Popup -->
<div id="popup">
  <div id="popupBox">
    <h2 id="questionText"></h2>
    <p id="answerText" style="display:none;"></p>
    <button onclick="showAnswer()">Show Answer</button>
    <button onclick="correct()">Correct</button>
    <button onclick="wrong()">Wrong</button>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel">
  <div id="adminBox">
    <h2>Edit Questions</h2>

    <label>Category</label>
    <input id="catInput">

    <label>Question</label>
    <textarea id="qInput"></textarea>

    <label>Answer</label>
    <textarea id="aInput"></textarea>

    <label>Value</label>
    <select id="vInput">
      <option>200</option><option>400</option><option>600</option>
      <option>800</option><option>1000</option>
    </select>

    <button onclick="addQuestion()">Add / Update Question</button>
    <button onclick="closeAdmin()">Close</button>

    <h3>Existing Questions</h3>
    <div id="questionList"></div>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("jeopardyData") || "[]");
let score = 0;
let currentValue = 0;

// Obfuscated password ("asdk")
const keyParts = ["a", "sd", "k"];
const adminPassword = keyParts.join("");

// Save to localStorage
function saveData() {
  localStorage.setItem("jeopardyData", JSON.stringify(data));
}

// Random Daily Doubles
function assignRandomDailyDoubles() {
  data.forEach(q => q.dailyDouble = "FALSE");
  let pool = [...data];
  for (let i = 0; i < 2; i++) {
    const index = Math.floor(Math.random() * pool.length);
    pool[index].dailyDouble = "TRUE";
    pool.splice(index, 1);
  }
}

// Build board
function buildBoard() {
  assignRandomDailyDoubles();
  const board = document.getElementById("board");
  board.innerHTML = "";

  const categories = [...new Set(data.map(q => q.category))];

  categories.forEach(cat => {
    board.innerHTML += `<div class='cell category'>${cat}</div>`;
  });

  for (let value of [200, 400, 600, 800, 1000]) {
    categories.forEach(cat => {
      const q = data.find(x => x.category === cat && Number(x.value) === value);
      if (q) {
        board.innerHTML += `<div class='cell' onclick='openQuestion(${JSON.stringify(q)})'>${value}</div>`;
      } else {
        board.innerHTML += `<div class='cell'></div>`;
      }
    });
  }
}

// Open question popup
function openQuestion(q) {
  currentValue = Number(q.value);

  if (q.dailyDouble === "TRUE") {
    document.getElementById("questionText").innerText =
      "🎉 DAILY DOUBLE! 🎉\n\n" + q.question;
  } else {
    document.getElementById("questionText").innerText = q.question;
  }

  document.getElementById("answerText").innerText = q.answer;
  document.getElementById("popup").style.display = "flex";
}

function showAnswer() {
  document.getElementById("answerText").style.display = "block";
}

function correct() {
  score += currentValue;
  updateScore();
  closePopup();
}

function wrong() {
  score -= currentValue;
  updateScore();
  closePopup();
}

function updateScore() {
  document.getElementById("score").innerText = "Score: " + score;
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
  document.getElementById("answerText").style.display = "none";
}

// Admin Mode
function openAdmin() {
  document.getElementById("adminPanel").style.display = "flex";
  renderQuestionList();
}

function closeAdmin() {
  document.getElementById("adminPanel").style.display = "none";
}

function addQuestion() {
  const cat = document.getElementById("catInput").value;
  const q = document.getElementById("qInput").value;
  const a = document.getElementById("aInput").value;
  const v = document.getElementById("vInput").value;

  data.push({ category: cat, question: q, answer: a, value: v, dailyDouble: "FALSE" });
  saveData();
  buildBoard();
  renderQuestionList();
}

function deleteQuestion(index) {
  data.splice(index, 1);
  saveData();
  buildBoard();
  renderQuestionList();
}

function renderQuestionList() {
  const list = document.getElementById("questionList");
  list.innerHTML = "";

  data.forEach((q, i) => {
    list.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:5px; background:white; color:black;">
        <b>${q.category}</b> - $${q.value}<br>
        ${q.question}<br>
        <button onclick="deleteQuestion(${i})">Delete</button>
      </div>
    `;
  });
}

// Admin unlock listener
document.getElementById("adminTrigger").addEventListener("input", (e) => {
  if (e.target.value.toLowerCase() === "admin") {
    const attempt = prompt("Enter password:");
    if (attempt === adminPassword) {
      openAdmin();
    } else {
      alert("Incorrect password");
    }
    e.target.value = "";
  }
});

buildBoard();
</script>

</body>
</html>
