<!DOCTYPE html>
<html>
<head>
  <title>Jeopardy Game</title>
  <style>
    body { font-family: Arial; background: #001f3f; color: white; text-align: center; }
    #board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 90%; margin: auto; }
    .cell { background: #003f7f; padding: 20px; cursor: pointer; font-size: 22px; }
    .category { background: #005fbf; font-weight: bold; }
    #popup, #editPopup {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center;
    }
    #popupBox, #editBox {
      background: white; color: black; padding: 20px; width: 450px; max-height: 90%; overflow-y: auto;
    }
    button { padding: 10px; margin: 5px; }
    input, select, textarea { width: 100%; margin: 5px 0; padding: 8px; }
  </style>
</head>
<body>

<h1>Jeopardy</h1>
<h2 id="score">Score: 0</h2>

<div id="board"></div>

<!-- Gameplay Popup -->
<div id="popup">
  <div id="popupBox">
    <h2 id="questionText"></h2>
    <p id="answerText" style="display:none;"></p>
    <button onclick="showAnswer()">Show Answer</button>
    <button onclick="correct()">Correct</button>
    <button onclick="wrong()">Wrong</button>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<!-- Edit Popup -->
<div id="editPopup">
  <div id="editBox">
    <h2>Edit Question</h2>

    <label>Category</label>
    <input id="editCat">

    <label>Question</label>
    <textarea id="editQ"></textarea>

    <label>Answer</label>
    <textarea id="editA"></textarea>

    <label>Value</label>
    <select id="editV">
      <option>200</option><option>400</option><option>600</option>
      <option>800</option><option>1000</option>
    </select>

    <button onclick="saveEdit()">Save</button>
    <button onclick="deleteQuestion()">Delete</button>
    <button onclick="closeEdit()">Close</button>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("jeopardyData") || "[]");
let score = 0;
let currentValue = 0;
let adminMode = false;
let editingIndex = null;

// Obfuscated password "asdk"
const p1 = "a";
const p2 = "sd";
const p3 = "k";
const adminPassword = p1 + p2 + p3;

// Save to localStorage
function saveData() {
  localStorage.setItem("jeopardyData", JSON.stringify(data));
}

// Random Daily Doubles
function assignRandomDailyDoubles() {
  data.forEach(q => q.dailyDouble = "FALSE");
  let pool = [...data];
  for (let i = 0; i < 2; i++) {
    const index = Math.floor(Math.random() * pool.length);
    pool[index].dailyDouble = "TRUE";
    pool.splice(index, 1);
  }
}

// Build board
function buildBoard() {
  assignRandomDailyDoubles();
  const board = document.getElementById("board");
  board.innerHTML = "";

  const categories = [...new Set(data.map(q => q.category))];

  categories.forEach(cat => {
    board.innerHTML += `<div class='cell category'>${cat}</div>`;
  });

  for (let value of [200, 400, 600, 800, 1000]) {
    categories.forEach(cat => {
      const q = data.find(x => x.category === cat && Number(x.value) === value);
      if (q) {
        board.innerHTML += `<div class='cell' onclick='cellClick(${data.indexOf(q)})'>${value}</div>`;
      } else {
        board.innerHTML += `<div class='cell'></div>`;
      }
    });
  }
}

// Handle clicking a question
function cellClick(index) {
  const q = data[index];
  editingIndex = index;

  if (adminMode) {
    openEdit(q);
  } else {
    openQuestion(q);
  }
}

// Gameplay popup
function openQuestion(q) {
  currentValue = Number(q.value);

  if (q.dailyDouble === "TRUE") {
    document.getElementById("questionText").innerText =
      "🎉 DAILY DOUBLE! 🎉\n\n" + q.question;
  } else {
    document.getElementById("questionText").innerText = q.question;
  }

  document.getElementById("answerText").innerText = q.answer;
  document.getElementById("popup").style.display = "flex";
}

function showAnswer() {
  document.getElementById("answerText").style.display = "block";
}

function correct() {
  score += currentValue;
  updateScore();
  closePopup();
}

function wrong() {
  score -= currentValue;
  updateScore();
  closePopup();
}

function updateScore() {
  document.getElementById("score").innerText = "Score: " + score;
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
  document.getElementById("answerText").style.display = "none";
}

// Edit popup
function openEdit(q) {
  document.getElementById("editCat").value = q.category;
  document.getElementById("editQ").value = q.question;
  document.getElementById("editA").value = q.answer;
  document.getElementById("editV").value = q.value;

  document.getElementById("editPopup").style.display = "flex";
}

function saveEdit() {
  data[editingIndex] = {
    category: document.getElementById("editCat").value,
    question: document.getElementById("editQ").value,
    answer: document.getElementById("editA").value,
    value: document.getElementById("editV").value,
    dailyDouble: "FALSE"
  };

  saveData();
  buildBoard();
  closeEdit();
}

function deleteQuestion() {
  data.splice(editingIndex, 1);
  saveData();
  buildBoard();
  closeEdit();
}

function closeEdit() {
  document.getElementById("editPopup").style.display = "none";
}

// Keyboard listener for admin unlock
let buffer = "";

document.addEventListener("keydown", (e) => {
  buffer += e.key.toLowerCase();
  if (buffer.length > 10) buffer = buffer.slice(-10);

  if (buffer.includes("admin")) {
    const attempt = prompt("Enter password:");
    if (attempt === adminPassword) {
      adminMode = true;
      alert("Admin mode activated");
    } else {
      alert("Incorrect password");
    }
    buffer = "";
  }
});

buildBoard();
</script>

</body>
</html>
