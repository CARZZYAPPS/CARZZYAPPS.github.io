<!DOCTYPE html>
<html lang="en-US">

<head>

    <title>Carzzy Apps nav-bar</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        nav,
        nav *,
        nav img {
            all: revert;
        }

        nav {
            background: #1a1a1a;
            box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            height: 80px;
            padding: 0;
            padding-bottom: 4px;
            display: flex;
            align-items: center;
            position: fixed;
            top: 0px;
            user-select: none;
            box-sizing: border-box;
            z-index: 1;
        }

        .logo {
            margin-top: 6px;
            margin-left: 1.5vw;
        }

        .nav-head {
            color: #00d1b2;
            font-size: 35px;
            display: inline;
            margin-left: 5vw;
        }

        .nav-links {
            position: absolute;
            right: 1.5vw;
        }

        .nav-link,
        .nav-link:visited,
        .nav-link:active {
            color: white;
            margin: 0px;
            margin: 0px 1.75vw;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            text-align: right;
            transition: 0.4s;
        }

        .nav-link:hover {
            color: #00d1b2;
        }

        .menu-icon {
            padding: 16px;
            height: 48px;
            display: none;
        }

        .menu-icon:hover {
            background: #3a3a3a;
        }

        .menu-popup {
            position: absolute;
            top: 80px;
            right: 0px;
            padding: 0;
            margin: 0;
            background: #010101;
            color: white;
            list-style: none;
            display: none;
            border: solid #00d1b2 5px;
            box-shadow: -7px 7px 15px rgba(0, 0, 0, 0.5);
        }

        #close-menu {
            font-size: 40px;
            position: absolute;
            top: -10px;
            right: 10px;
            transition: 0.4s;
        }

        #close-menu:hover {
            color: #00d1b2
        }

        .menu-link {
            font-size: 23px;
            font-weight: bold;
            padding: 17px 30px;
            text-align: center;
            transition: 0.4s;
        }

        .list-nav-link, .list-nav-link:visited, .list-nav-link:active {
            color: white;
            text-decoration: none;
        }

        .menu-link:hover {
            background-color: #2a2a2a;
            color: #00d1b2;
        }

        @media (min-width: 1251px) {
            .menu-popup {
                display: none;
            }
        }
        
        @media (max-width: 1250px) {
            .nav-head {
                display: none;
            }
        }

        @media (max-width: 930px) {
            nav {
                padding-bottom: 0;
            }

            .nav-head {
                display: inline;
                padding-bottom: 4px;
            }

            .menu-icon {
                position: absolute;
                right: 0px;
                display: inline-block;
            }

            .nav-links {
                display: none;
            }

            .logo {
                margin-bottom: 4px;
            }

        }

        @media (max-width: 530px) {
            .nav-head {
                display: none;
            }
        }

    </style>

</head>

<body>

    <nav>
        <a class="logo" href="/"><img src="https://carzzyapps.com/Carzzy%20Apps%20Logo.png" style="width:150px;height:50px;"
                alt="Carzzy Apps Logo"></a>
        <h1 class="nav-head">Carzzy Apps</h1>
                <span class="nav-links">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/Leaderboards">Leaderboards</a>
                <a class="nav-link" href="/scymores-games">Scymore's Games</a>
                <a class="nav-link" href="/contact-us">Contact Us</a>
            </span>

            <img src="/menu.svg" class="menu-icon" alt="">


            <ul class="menu-popup">

                <span id="close-menu">&times;</span>
                <a href="/" class="list-nav-link"><li class="menu-link">Home</li></a>
                <a href="/Leaderboards/" class="list-nav-link"><li class="menu-link">Leaderboards</li></a>
                <a href="/scymores-games/" class="list-nav-link"><li class="menu-link">Scymore's Games</li></a>
                <a href="/contact-us" class="list-nav-link"><li class="menu-link">Contact Us</li></a>

            </ul>

    </nav>
    
    <script>

        const menuIcon = document.querySelector('.menu-icon');
        const menu = document.querySelector('.menu-popup');

        menuIcon.addEventListener('click', () => {
            menu.style.display = 'block';
        });

        document.querySelector('#close-menu')?.addEventListener('click', () => {
            menu.style.display = 'none';
        });


    </script>
    
</body>

</html>
