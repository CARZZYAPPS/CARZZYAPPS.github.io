<!DOCTYPE html>
<html lang="en-US">

    <head>
    
        <title>Carzzy Apps nav-bar</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico">

        <style>

            html, body {
                margin: 0;
                padding: 0;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            nav {
                background: #1a1a1a;
                box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.5);
                width: 100%;
                height: 80px;
                padding-bottom: 4px;
                display: flex;
                align-items: center;
                position: fixed;
                top: 0px;
                user-select: none;
                box-sizing: border-box;
            }

            .logo {
                margin-top: 6px;
                margin-left: 1.5vw;
            }

            .nav-head {
                color: #00d1b2;
                font-size: 35px;
                display: inline;
                margin-left: 5vw;
            }

            .nav-links {
                position: absolute;
                right: 1.75vw;
            }

            .nav-link, .nav-link:visited, .nav-link:active {
                color: white;
                margin: 0px;
                margin: 0px 1.75vw;
                font-size: 25px;
                font-weight: bold;
                text-decoration: none;
                text-align: right;
                transition: 0.4s;    
            }

            .nav-link:hover {
                color: #00d1b2;
            }

            @media (max-width: 1150px) {
                .nav-head {
                    display: none;
                }
            }

            @media (max-width: 800px) {
                .logo {
                    display: none;
                }
                nav {
                    justify-content: center;
                    text-align: center;
                }
                .nav-links {
                    position: static;
                }
            }
      
        </style>
        
    </head>

    <body>

        <nav>
            <a class="logo" href="/" target="_top"><img src="/Carzzy%20Apps%20Logo.png" style="width:150px;height:50px;" alt="Carzzy Apps Logo"></a>
            <h1 class="nav-head">Carzzy Apps</h1>
            <span class="nav-links">
                <a class="nav-link" href="/" target="_top">Home</a>
                <a class="nav-link" href="/Leaderboards" target="_top">Leaderboards</a>
                <a class="nav-link" href="/scymores-games" target="_top">Scymore's Games</a>  
            </span>
        </nav>
        
    </body>

</html>
