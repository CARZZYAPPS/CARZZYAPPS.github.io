<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carzzy Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ui">
    <h1>Carzzy Quest</h1>

    <form id="player-form">
      <label>
        Username:
        <input type="text" id="username" required />
      </label>
      <button type="submit">Start Game</button>
    </form>

    <div class="stats-leaderboard">
      <div class="stats">
        <h2>Your Stats</h2>
        <p>High Score: <span id="stat-high">-</span></p>
        <p>Games Played: <span id="stat-games">-</span></p>
        <p>Last Score: <span id="stat-last">-</span></p>
        <p>Average Score: <span id="stat-avg">-</span></p>
      </div>

      <div class="leaderboard">
        <h2>Leaderboard</h2>
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr><td colspan="3">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="hud">
      <span>Player: <strong id="hud-username">-</strong></span>
      <span>Score: <strong id="hud-score">0</strong></span>
      <span>Status: <strong id="hud-status">Enter username to load stats</strong></span>
    </div>
  </div>

  <canvas id="game" width="960" height="480"></canvas>

  <div class="mobile-controls">
    <button id="btn-left">◀</button>
    <button id="btn-jump">⬆</button>
    <button id="btn-right">▶</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
